# The service that hands signed builds to pack-sync: a ready-made server for packs without a site
# of their own, and a library a site can mount, as the author's site does.
[package]
name = "pack-sync-hub"
description = "Serves a Horizon modpack's signed builds to pack-sync from private GitHub releases"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
governor = "0.10"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
