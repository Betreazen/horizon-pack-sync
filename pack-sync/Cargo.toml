# The updater: on a player's PC before each start, on the game server as a service, and the
# owner's signing tool. Each pack owner builds their own, with their settings baked in.
[package]
name = "pack-sync"
description = "Keeps a Horizon modpack's players and server on one signed build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "3.0.0"
flate2 = "1.1.11"
getrandom = "0.4.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
toml = "0.9"
ureq = { version = "3.5.1", features = ["json"] }

[build-dependencies]
toml = "0.9"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
